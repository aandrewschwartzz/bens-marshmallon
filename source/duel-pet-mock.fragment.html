<style>
  #duel-pet-mock.dp-wrap { display: grid; justify-items: center; gap: 12px; padding: 8px 0; color: var(--foreground); }
  #duel-pet-mock .dp-stage { width: min(100%, 520px); display: grid; place-items: center; padding: 26px; border-radius: 28px; background: color-mix(in srgb, var(--muted) 34%, transparent); }
  #duel-pet-mock .dp-device { width: min(100%, 420px); aspect-ratio: 1; display: grid; place-items: center; padding: 24px; border-radius: 38px; background: #17191c; box-shadow: 0 20px 42px rgb(0 0 0 / 24%), inset 0 0 0 3px #4d5155; }
  #duel-pet-mock .dp-screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; image-rendering: pixelated; touch-action: manipulation; }
  #duel-pet-mock .tap-target { cursor: pointer; }
  #duel-pet-mock .key rect, #duel-pet-mock .utility-key rect { fill: #fff5d9; stroke: #5b3826; }
  #duel-pet-mock .key text, #duel-pet-mock .utility-key text { fill: #20130d; font-family: ui-monospace, monospace; font-size: 10px; }
  #duel-pet-mock .apply-key rect { fill: #6e3425; }
  #duel-pet-mock .apply-key text { fill: #fff5d9; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 500; }
  #duel-pet-mock .new-game-key rect { fill: #6e3425; }
  #duel-pet-mock .new-game-key text { fill: #fff5d9; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 1px; }
  #duel-pet-mock .tap-target:active { opacity: .72; }
  #duel-pet-mock .dp-hint { margin: 0; color: var(--muted-foreground); text-align: center; }
  #duel-pet-mock #pet { transform-origin: 172px 126px; animation: dp-breathe 1.8s steps(2, end) infinite; }
  #duel-pet-mock.react-hit #pet { animation: dp-hit .52s steps(4, end) 1; }
  #duel-pet-mock.react-hit #reaction { animation: dp-burst .82s steps(2, end) 1; }
  #duel-pet-mock.react-celebrate #pet { animation: dp-celebrate .72s steps(4, end) 1; filter: drop-shadow(0 0 5px #f2b72f); }
  #duel-pet-mock.react-celebrate #reaction { animation: dp-burst .82s steps(2, end) 1; }
  #duel-pet-mock.react-concern #pet { animation: dp-concern .72s steps(3, end) 1; }
  #duel-pet-mock.react-concern #reaction { animation: dp-burst .82s steps(2, end) 1; }
  #duel-pet-mock.react-heal #pet { animation: dp-heal .8s steps(4, end) 1; filter: url(#dp-glow); }
  #duel-pet-mock.game-won #game-over-pet { transform-origin: 120px 136px; animation: dp-victory .75s steps(4, end) infinite; }
  #duel-pet-mock.game-won #confetti { animation: dp-confetti 1.4s steps(5, end) infinite; }
  #duel-pet-mock.game-lost #game-over-pet { transform-origin: 120px 160px; animation: dp-defeat 1.2s steps(3, end) infinite; }
  #duel-pet-mock.game-lost #crown { display: none; }
  #duel-pet-mock.game-lost #confetti { display: none; }
  @keyframes dp-breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.02); } }
  @keyframes dp-hit { 0% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-12px) rotate(-8deg); } 50% { transform: translateX(10px) rotate(7deg); } 75% { transform: translateX(-5px) rotate(-3deg); } 100% { transform: translateX(0) rotate(0); } }
  @keyframes dp-celebrate { 0%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-12px) scale(1.07) rotate(-4deg); } 60% { transform: translateY(-5px) scale(1.04) rotate(4deg); } }
  @keyframes dp-concern { 0%,100% { transform: translateY(0) scale(1); } 35% { transform: translateY(5px) scale(.92) rotate(-3deg); } 70% { transform: translateY(3px) scale(.95) rotate(3deg); } }
  @keyframes dp-burst { 0% { opacity: 0; transform: scale(.3); transform-origin: 159px 114px; } 30%,70% { opacity: 1; transform: scale(1); transform-origin: 159px 114px; } 100% { opacity: 0; transform: scale(1.15); transform-origin: 159px 114px; } }
  @keyframes dp-heal { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-8px) scale(1.12); } }
  @keyframes dp-victory { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
  @keyframes dp-confetti { 0% { transform: translateY(-12px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(36px); opacity: 0; } }
  @keyframes dp-defeat { 0%,100% { transform: translateY(5px) scaleY(.92); } 50% { transform: translateY(8px) scaleY(.86); } }
  @media (max-width: 480px) { #duel-pet-mock .dp-stage { padding: 18px; } #duel-pet-mock .dp-device { padding: 18px; border-radius: 30px; } }
</style>

<script>
(() => {
  const root = document.getElementById('duel-pet-mock');
  const home = root.querySelector('#home-screen');
  const amountScreen = root.querySelector('#amount-screen');
  const gameOverScreen = root.querySelector('#game-over-screen');
  const values = { p1: 8000, p2: 8000 };
  let selected = 'p1';
  let mode = 'loss';
  let amount = '';

  const formatAmount = () => amount === '' ? '0' : String(Number(amount));
  const selectedName = () => selected === 'p1' ? 'BEN' : 'PLAYER 2';
  const updateAmountScreen = () => {
    root.querySelector('#edit-player').textContent = selectedName() + ' · ' + values[selected] + ' LP';
    root.querySelector('#amount-value').textContent = formatAmount();
    root.querySelector('#apply-sign').textContent = (mode === 'loss' ? '−' : '+') + formatAmount();
    const loss = mode === 'loss';
    root.querySelector('#loss-bg').setAttribute('fill', loss ? '#6e3425' : '#fff5d9');
    root.querySelector('#loss-bg').setAttribute('stroke', loss ? 'none' : '#5b3826');
    root.querySelector('#loss-text').setAttribute('fill', loss ? '#fff5d9' : '#60483b');
    root.querySelector('#gain-bg').setAttribute('fill', loss ? '#fff5d9' : '#6e3425');
    root.querySelector('#gain-bg').setAttribute('stroke', loss ? '#5b3826' : 'none');
    root.querySelector('#gain-text').setAttribute('fill', loss ? '#60483b' : '#fff5d9');
  };
  const showAmount = (player) => {
    selected = player;
    amount = '';
    mode = 'loss';
    home.setAttribute('display', 'none');
    amountScreen.removeAttribute('display');
    updateAmountScreen();
  };
  const showHome = () => {
    amountScreen.setAttribute('display', 'none');
    gameOverScreen.setAttribute('display', 'none');
    home.removeAttribute('display');
  };
  const showGameOver = () => {
    home.setAttribute('display', 'none');
    amountScreen.setAttribute('display', 'none');
    gameOverScreen.removeAttribute('display');
    const benWon = values.p2 === 0;
    root.classList.remove('react-hit', 'react-celebrate', 'react-concern', 'react-heal', 'game-won', 'game-lost');
    root.classList.add(benWon ? 'game-won' : 'game-lost');
    root.querySelector('#winner-name').textContent = benWon ? 'BEN WINS!' : 'PLAYER 2 WINS';
    root.querySelector('#final-score').textContent = values.p1 + ' — ' + values.p2;
    root.querySelector('#final-mouth').setAttribute('d', 'M101 93Q116 82 131 92');
  };
  const applyChange = () => {
    const delta = Number(formatAmount());
    if (!delta) return;
    values[selected] = mode === 'loss' ? Math.max(0, values[selected] - delta) : values[selected] + delta;
    root.querySelector('#p1-lp').textContent = String(values.p1);
    root.querySelector('#p2-lp').textContent = String(values.p2);
    const opponentHit = mode === 'loss' && selected === 'p2';
    const benHit = mode === 'loss' && selected === 'p1';
    const benGain = mode === 'gain' && selected === 'p1';
    const opponentGain = mode === 'gain' && selected === 'p2';
    root.querySelector('#reaction-text').textContent = (mode === 'loss' ? '−' : '+') + delta;
    root.querySelector('#reaction-burst').setAttribute('fill', opponentHit ? '#f0a82f' : benGain ? '#54a95f' : '#d9422e');
    if (opponentHit) {
      root.querySelector('#pet-status').textContent = delta >= 2000 ? 'HUGE HIT!' : 'NICE HIT!';
    } else if (benHit) {
      root.querySelector('#pet-status').textContent = delta >= 2000 ? 'OH NO, BEN!' : 'BEN!';
    } else if (selected === 'p1') {
      root.querySelector('#pet-status').textContent = 'FEELING BETTER!';
    } else {
      root.querySelector('#pet-status').textContent = 'UH-OH...';
    }
    root.classList.remove('react-hit', 'react-celebrate', 'react-concern', 'react-heal');
    void root.offsetWidth;
    root.classList.add(opponentHit || benGain ? 'react-celebrate' : benHit ? 'react-hit' : opponentGain ? 'react-concern' : 'react-heal');
    showHome();
    if (values[selected] === 0) {
      setTimeout(showGameOver, 850);
    } else {
      setTimeout(() => {
        root.classList.remove('react-hit', 'react-celebrate', 'react-concern', 'react-heal');
        root.querySelector('#pet-status').textContent = '';
      }, 900);
    }
  };
  const newGame = () => {
    values.p1 = 8000;
    values.p2 = 8000;
    root.querySelector('#p1-lp').textContent = '8000';
    root.querySelector('#p2-lp').textContent = '8000';
    root.querySelector('#pet-status').textContent = '';
    root.classList.remove('game-won', 'game-lost', 'react-hit', 'react-celebrate', 'react-concern', 'react-heal');
    showHome();
  };

  root.querySelector('#select-p1').addEventListener('click', () => showAmount('p1'));
  root.querySelector('#select-p2').addEventListener('click', () => showAmount('p2'));
  root.querySelector('#back').addEventListener('click', showHome);
  root.querySelector('#sign-loss').addEventListener('click', () => { mode = 'loss'; updateAmountScreen(); });
  root.querySelector('#sign-gain').addEventListener('click', () => { mode = 'gain'; updateAmountScreen(); });
  root.querySelectorAll('[data-key]').forEach((key) => {
    key.addEventListener('click', () => {
      if (amount.length >= 5) return;
      amount = (amount + key.dataset.key).replace(/^0+(?=\d)/, '');
      updateAmountScreen();
    });
  });
  root.querySelector('#delete').addEventListener('click', () => { amount = amount.slice(0, -1); updateAmountScreen(); });
  root.querySelector('#clear').addEventListener('click', () => { amount = ''; updateAmountScreen(); });
  root.querySelector('#apply').addEventListener('click', applyChange);
  root.querySelector('#new-game').addEventListener('click', newGame);
})();
</script>
